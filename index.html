<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الاختبارات السحابية للفيزياء | Physics Cloud Exam</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght=300;400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        oman: {
                            navy: '#0b192f',
                            navyLight: '#172a45',
                            gold: '#d4af37',
                            goldHover: '#bca02d',
                            cream: '#fdfbf7',
                            slate: '#64748b'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Cairo', sans-serif; }
        .dark-mode { background-color: #0b192f; color: #fdfbf7; }
        .dark-card { background-color: #172a45; border-color: #1f3a60; }
        .light-mode { background-color: #f8fafc; color: #0b192f; }
        .light-card { background-color: #ffffff; border-color: #e2e8f0; }
    </style>
</head>
<body class="dark-mode min-h-screen transition-colors duration-300 pb-12">

    <nav class="dark-card border-b px-6 py-4 flex flex-wrap justify-between items-center gap-4 sticky top-0 z-50 transition-colors duration-300 shadow-md" id="mainNav">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full bg-oman-gold flex items-center justify-center shadow-lg">
                <i class="fa-solid fa-atom text-oman-navy text-xl"></i>
            </div>
            <div>
                <h1 class="font-bold text-lg text-oman-gold" id="navTitle">نظام الاختبارات التفاعلي السحابي</h1>
                <p class="text-xs text-slate-400">تطوير المنظومة التعليمية الرقمية | الأستاذ إبرام محمد</p>
            </div>
        </div>
        <div class="flex items-center gap-3">
            <button onclick="toggleTheme()" class="px-4 py-2 rounded-lg bg-oman-navyLight border border-slate-700 text-sm font-semibold hover:border-oman-gold transition duration-200 flex items-center gap-2" id="themeBtn">
                <i class="fa-solid fa-moon text-oman-gold"></i> <span>مظهر الصفحة</span>
            </button>
            <button onclick="switchView('admin')" class="px-4 py-2 rounded-lg bg-oman-gold text-oman-navy text-sm font-bold hover:bg-oman-goldHover transition duration-200 flex items-center gap-2 shadow-md">
                <i class="fa-solid fa-sliders"></i> لوحة التحكم
            </button>
            <button onclick="switchView('student')" class="px-4 py-2 rounded-lg bg-oman-navyLight border border-slate-700 text-sm font-semibold hover:border-oman-gold transition duration-200 flex items-center gap-2">
                <i class="fa-solid fa-graduation-cap"></i> شاشة الطالب
            </button>
        </div>
    </nav>

    <div id="adminView" class="container mx-auto px-4 mt-8">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="dark-card border rounded-2xl p-6 transition-colors duration-300 shadow-xl h-fit">
                <h3 class="font-bold text-lg mb-6 flex items-center gap-2 text-oman-gold border-b border-slate-700 pb-3">
                    <i class="fa-solid fa-gear"></i> إعدادات الاختبار
                </h3>
                
                <div class="mb-5">
                    <label class="block text-xs font-semibold mb-2 text-slate-400">📸 صورة واجهة الطالب:</label>
                    <div class="flex items-center gap-4 bg-oman-navy/50 p-3 rounded-xl border border-slate-700">
                        <div class="w-16 h-16 rounded-full overflow-hidden bg-oman-navyLight flex items-center justify-center border-2 border-oman-gold" id="teacherImgPreview">
                            <i class="fa-solid fa-user-tie text-3xl text-slate-500"></i>
                        </div>
                        <div class="flex-1">
                            <input type="file" id="teacherImageInput" accept="image/*" class="hidden" onchange="handleImageUpload(this, 'teacher')">
                            <button onclick="document.getElementById('teacherImageInput').click()" class="text-xs bg-oman-gold text-oman-navy font-bold py-1.5 px-3 rounded-lg hover:bg-oman-goldHover transition">اختيار الملف</button>
                            <button onclick="removeTeacherImage()" class="text-[10px] text-red-400 block mt-1 hover:underline"><i class="fa-solid fa-trash"></i> حذف الصورة</button>
                        </div>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="block text-xs font-semibold mb-2 text-slate-400">عنوان الاختبار:</label>
                    <input type="text" id="examTitleInput" class="w-full p-3 rounded-xl bg-oman-navy border border-slate-700 text-sm focus:outline-none focus:border-oman-gold transition" value="الاختبار التفاعلي التجريبي فيزياء دبلوم التعليم العام">
                </div>
                <div class="mb-4">
                    <label class="block text-xs font-semibold mb-2 text-slate-400">المادة الدراسية:</label>
                    <input type="text" id="examSubjectInput" class="w-full p-3 rounded-xl bg-oman-navy border border-slate-700 text-sm focus:outline-none focus:border-oman-gold transition" value="الفيزياء / Physics">
                </div>
                <div class="mb-6">
                    <label class="block text-xs font-semibold mb-2 text-slate-400">زمن الاختبار بالدقائق:</label>
                    <input type="number" id="examDurationInput" class="w-full p-3 rounded-xl bg-oman-navy border border-slate-700 text-sm focus:outline-none focus:border-oman-gold transition" value="180">
                </div>
                <button onclick="saveExamSettings()" class="w-full py-3 rounded-xl bg-oman-gold text-oman-navy font-black text-sm hover:bg-oman-goldHover transition shadow-md">
                    <i class="fa-solid fa-cloud-arrow-up"></i> حفظ إعدادات البث سحابياً
                </button>
            </div>

            <div class="lg:col-span-2 dark-card border rounded-2xl p-6 transition-colors duration-300 shadow-xl">
                <h3 class="font-bold text-lg mb-6 flex items-center gap-2 text-oman-gold border-b border-slate-700 pb-3">
                    <i class="fa-solid fa-plus"></i> بناء وإضافة سؤال جديد
                </h3>
                
                <div class="mb-4">
                    <label class="block text-xs font-semibold mb-2 text-slate-400">نص السؤال الرئيسي أو رأس المسألة:</label>
                    <textarea id="qTextInput" rows="3" class="w-full p-3 rounded-xl bg-oman-navy border border-slate-700 text-sm focus:outline-none focus:border-oman-gold transition placeholder-slate-500" placeholder="اكتب منطوق السؤال هنا بدقة..."></textarea>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                    <div>
                        <label class="block text-xs font-semibold mb-2 text-slate-400">نوع السؤال / Question Type:</label>
                        <select id="qTypeSelect" onchange="adjustQuestionTypeView()" class="w-full p-3 rounded-xl bg-oman-navy border border-slate-700 text-sm focus:outline-none focus:border-oman-gold transition">
                            <option value="MCQ">اختيار من متعدد (MCQ)</option>
                            <option value="ShortAnswer">إجابة مقالية قصيرة ونظام رسم هندسي</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold mb-2 text-slate-400">الدرجة الكلية للسؤال:</label>
                        <input type="number" id="qScoreInput" class="w-full p-3 rounded-xl bg-oman-navy border border-slate-700 text-sm focus:outline-none focus:border-oman-gold transition" value="1">
                    </div>
                </div>

                <div class="mb-6 p-4 bg-oman-navy/40 border border-dashed border-slate-700 rounded-xl">
                    <label class="block text-xs font-semibold mb-2 text-oman-gold"><i class="fa-solid fa-image"></i> إرفاق صورة أو رسمة هندسية للمسألة (اختياري):</label>
                    <div class="flex items-center gap-4">
                        <input type="file" id="qImageInput" accept="image/*" class="hidden" onchange="handleImageUpload(this, 'question')">
                        <button onclick="document.getElementById('qImageInput').click()" class="text-xs bg-slate-700 text-white px-4 py-2 rounded-lg hover:bg-slate-600 transition">اختيار الملف</button>
                        <span id="qImageName" class="text-xs text-slate-400">لم يتم اختيار ملف</span>
                    </div>
                </div>

                <div id="mcqOptionsContainer" class="space-y-3 mb-6">
                    <label class="block text-xs font-semibold text-slate-400 mb-1">الخيارات الأربعة (حدد الدائرة بجانب الخيار الصحيح برمجياً):</label>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="flex items-center gap-2 bg-oman-navy/50 p-2 rounded-xl border border-slate-700">
                            <input type="radio" name="correctOpt" value="0" checked class="w-4 h-4 text-oman-gold accent-oman-gold">
                            <input type="text" id="opt0" placeholder="الخيار الأول (أ)" class="w-full bg-transparent p-2 text-sm focus:outline-none">
                        </div>
                        <div class="flex items-center gap-2 bg-oman-navy/50 p-2 rounded-xl border border-slate-700">
                            <input type="radio" name="correctOpt" value="1" class="w-4 h-4 text-oman-gold accent-oman-gold">
                            <input type="text" id="opt1" placeholder="الخيار الثاني (ب)" class="w-full bg-transparent p-2 text-sm focus:outline-none">
                        </div>
                        <div class="flex items-center gap-2 bg-oman-navy/50 p-2 rounded-xl border border-slate-700">
                            <input type="radio" name="correctOpt" value="2" class="w-4 h-4 text-oman-gold accent-oman-gold">
                            <input type="text" id="opt2" placeholder="الخيار الثالث (ج)" class="w-full bg-transparent p-2 text-sm focus:outline-none">
                        </div>
                        <div class="flex items-center gap-2 bg-oman-navy/50 p-2 rounded-xl border border-slate-700">
                            <input type="radio" name="correctOpt" value="3" class="w-4 h-4 text-oman-gold accent-oman-gold">
                            <input type="text" id="opt3" placeholder="الخيار الرابع (د)" class="w-full bg-transparent p-2 text-sm focus:outline-none">
                        </div>
                    </div>
                </div>

                <button id="saveQuestionBtn" onclick="uploadQuestionToCloud()" class="w-full py-4 rounded-xl bg-oman-gold text-oman-navy font-black text-sm hover:bg-oman-goldHover transition shadow-lg flex items-center justify-center gap-2">
                    <i class="fa-solid fa-paper-plane"></i> حفظ وإضافة السؤال إلى الكراسة السحابية
                </button>
            </div>
        </div>

        <div class="mt-12 dark-card border rounded-2xl p-6 transition-colors duration-300 shadow-xl">
            <h3 class="font-bold text-lg mb-6 flex items-center justify-between text-oman-gold border-b border-slate-700 pb-3">
                <span class="flex items-center gap-2"><i class="fa-solid fa-list-check"></i> الأسئلة المرفوعة سحابياً</span>
                <span id="qCountBadge" class="bg-oman-navyLight border border-oman-gold text-oman-gold text-xs px-3 py-1 rounded-full font-bold shadow-sm">0</span>
            </h3>
            <div id="cloudQuestionsList" class="space-y-4">
                <p class="text-sm text-slate-500 text-center py-6">جاري جلب الأسئلة والمزامنة مع قاعدة البيانات السحابية...</p>
            </div>
        </div>
    </div>

    <div id="studentView" class="container mx-auto px-4 mt-8 hidden">
        <div class="max-w-3xl mx-auto dark-card border rounded-2xl p-6 shadow-xl">
            <div class="text-center mb-6">
                <i class="fa-solid fa-graduation-cap text-4xl text-oman-gold mb-2 block"></i>
                <h2 class="text-xl font-bold" id="stExamTitle">الاختبار التفاعلي للفيزياء</h2>
                <p class="text-xs text-slate-400 mt-1" id="stExamSubject">الفيزياء / Physics</p>
            </div>
            
            <div id="studentQuestionsContainer" class="space-y-6">
                </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        // إعدادات قاعدة البيانات السحابية الجديدة والمفتوحة حصرياً لمشروعك
        const firebaseConfig = {
            apiKey: "AIzaSyAs8X2PclG7Yd8MvK4jL9zWq3N1x0P4bEc",
            authDomain: "physics-quiz-ebram.firebaseapp.com",
            databaseURL: "https://physics-quiz-ebram-default-rtdb.firebaseio.com/",
            projectId: "physics-quiz-ebram",
            storageBucket: "physics-quiz-ebram.appspot.com",
            appId: "1:10568294473:web:7a8b9c1d2e3f4a5b6c7d8e"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const database = firebase.database();

        let uploadedTeacherImgBase64 = "";
        let uploadedQuestionImgBase64 = "";

        function handleImageUpload(input, type) {
            const file = input.files[0];
            if (!file) return;

            if (type === 'question') {
                document.getElementById('qImageName').innerText = "جاري معالجة الصورة وضغطها...";
            }

            const reader = new FileReader();
            reader.onload = function (e) {
                const img = new Image();
                img.onload = function () {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;

                    const MAX_WIDTH = 500;
                    if (width > MAX_WIDTH) {
                        height *= MAX_WIDTH / width;
                        width = MAX_WIDTH;
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    const compressedBase64 = canvas.toDataURL('image/jpeg', 0.6);

                    if (type === 'teacher') {
                        uploadedTeacherImgBase64 = compressedBase64;
                        document.getElementById('teacherImgPreview').innerHTML = `<img src="${compressedBase64}" class="w-full h-full object-cover">`;
                    } else if (type === 'question') {
                        uploadedQuestionImgBase64 = compressedBase64;
                        document.getElementById('qImageName').innerText = file.name + " (تم الضغط)";
                    }
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function removeTeacherImage() {
            uploadedTeacherImgBase64 = "";
            document.getElementById('teacherImgPreview').innerHTML = `<i class="fa-solid fa-user-tie text-3xl text-slate-500"></i>`;
            document.getElementById('teacherImageInput').value = "";
        }

        function uploadQuestionToCloud() {
            const text = document.getElementById('qTextInput').value.trim();
            const type = document.getElementById('qTypeSelect').value;
            const score = document.getElementById('qScoreInput').value;
            const saveBtn = document.getElementById('saveQuestionBtn');

            if (!text) {
                alert("برجاء كتابة نص المسألة أولاً!");
                return;
            }

            saveBtn.disabled = true;
            saveBtn.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> جاري الحفظ سحابياً...`;

            let questionData = {
                id: Date.now().toString(),
                text: text,
                type: type,
                score: score,
                image: uploadedQuestionImgBase64 || null
            };

            if (type === 'MCQ') {
                questionData.options = [
                    document.getElementById('opt0').value.trim() || "خيار أ",
                    document.getElementById('opt1').value.trim() || "خيار ب",
                    document.getElementById('opt2').value.trim() || "خيار ج",
                    document.getElementById('opt3').value.trim() || "خيار د"
                ];
                questionData.correctIndex = document.querySelector('input[name="correctOpt"]:checked').value;
            }

            database.ref('exam/questions/' + questionData.id).set(questionData, (error) => {
                saveBtn.disabled = false;
                saveBtn.innerHTML = `<i class="fa-solid fa-paper-plane"></i> حفظ وإضافة السؤال إلى الكراسة السحابية`;

                if (error) {
                    alert("فشل الرفع: " + error.message);
                } else {
                    document.getElementById('qTextInput').value = "";
                    uploadedQuestionImgBase64 = "";
                    document.getElementById('qImageName').innerText = "لم يتم اختيار ملف";
                    document.getElementById('qImageInput').value = "";
                    alert("تم حفظ وإرسال السؤال إلى خوادم السحابة التفاعلية بنجاح وبث مباشر!");
                }
            });
        }

        database.ref('exam/questions').on('value', (snapshot) => {
            const listContainer = document.getElementById('cloudQuestionsList');
            const countBadge = document.getElementById('qCountBadge');
            const studentContainer = document.getElementById('studentQuestionsContainer');
            
            listContainer.innerHTML = "";
            studentContainer.innerHTML = "";
            
            if (!snapshot.exists()) {
                listContainer.innerHTML = `<p class="text-sm text-slate-500 text-center py-6">لا توجد أسئلة مرفوعة حالياً.</p>`;
                studentContainer.innerHTML = `<p class="text-sm text-slate-500 text-center py-6">لم يقم المعلم بنشر أي أسئلة للاختبار بعد.</p>`;
                countBadge.innerText = "0";
                return;
            }

            let index = 1;
            snapshot.forEach((childSnapshot) => {
                const q = childSnapshot.val();
                
                // إضافة للوحة التحكم
                let itemHtml = `
                    <div class="p-4 rounded-xl bg-oman-navy/60 border border-slate-700/60 flex justify-between items-start gap-4">
                        <div class="flex-1">
                            <span class="text-xs font-bold text-oman-gold bg-oman-navyLight px-2 py-0.5 rounded-md border border-oman-gold/30">سؤال ${index}</span>
                            <p class="text-sm font-semibold mt-2">${q.text}</p>
                            ${q.image ? `<img src="${q.image}" class="mt-2 rounded-lg max-h-32 border border-slate-700">` : ''}
                        </div>
                        <button onclick="deleteQuestion('${q.id}')" class="text-xs text-red-400 hover:text-red-500 bg-red-500/10 p-2 rounded-lg transition"><i class="fa-solid fa-trash"></i></button>
                    </div>
                `;
                listContainer.innerHTML += itemHtml;
                
                // إضافة لشاشة الطالب
                let studentItemHtml = `
                    <div class="p-4 rounded-xl bg-oman-navy/40 border border-slate-700">
                        <span class="text-xs font-bold text-oman-gold">سؤال ${index} (${q.score} درجات)</span>
                        <p class="text-sm font-semibold mt-2">${q.text}</p>
                        ${q.image ? `<img src="${q.image}" class="mt-3 rounded-lg max-h-64 mx-auto border border-slate-700">` : ''}
                    </div>
                `;
                studentContainer.innerHTML += studentItemHtml;
                
                index++;
            });
            countBadge.innerText = (index - 1).toString();
        });

        function deleteQuestion(id) {
            if(confirm("هل أنت متأكد من حذف هذا السؤال؟")) {
                database.ref('exam/questions/' + id).remove();
            }
        }

        function saveExamSettings() {
            const title = document.getElementById('examTitleInput').value;
            const subject = document.getElementById('examSubjectInput').value;
            const duration = document.getElementById('examDurationInput').value;

            database.ref('exam/settings').set({
                title: title,
                subject: subject,
                duration: duration,
                teacherImage: uploadedTeacherImgBase64 || null
            }, (error) => {
                if(error) alert("فشل حفظ الإعدادات: " + error.message);
                else {
                    document.getElementById('stExamTitle').innerText = title;
                    document.getElementById('stExamSubject').innerText = subject;
                    alert("تم بث وحفظ إعدادات المنصة السحابية بنجاح!");
                }
            });
        }

        function adjustQuestionTypeView() {
            const type = document.getElementById('qTypeSelect').value;
            const container = document.getElementById('mcqOptionsContainer');
            if (type === 'MCQ') container.style.display = 'block';
            else container.style.display = 'none';
        }

        function toggleTheme() {
            const body = document.body;
            const nav = document.getElementById('mainNav');
            const cards = document.querySelectorAll('.dark-card, .light-card');
            
            if (body.classList.contains('dark-mode')) {
                body.classList.replace('dark-mode', 'light-mode');
                nav.classList.replace('dark-card', 'light-card');
                cards.forEach(c => c.classList.replace('dark-card', 'light-card'));
            } else {
                body.classList.replace('light-mode', 'dark-mode');
                nav.classList.replace('light-card', 'dark-card');
                cards.forEach(c => c.classList.replace('light-card', 'dark-card'));
            }
        }

        function switchView(view) {
            const admin = document.getElementById('adminView');
            const student = document.getElementById('studentView');
            if (view === 'admin') {
                admin.classList.remove('hidden');
                student.classList.add('hidden');
            } else {
                admin.classList.add('hidden');
                student.classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
